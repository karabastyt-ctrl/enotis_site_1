<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка сайта-ленты 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.site{--bg:#F5EFE6;--paper:#FBF8F3;--ink:#2E2422;--mute:#6E625C;--bur:#3B1820;--bur2:#2A1016;--brown:#4E443B;--gold:#C9A15A;--line:#DDD2C4;--tag:rgba(30,40,60,.62);
 container-type:inline-size;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;height:100%;position:relative;overflow:hidden}
.s-scroll{height:100%;overflow:auto;position:relative}
.site *{box-sizing:border-box}
.site h1,.site h2,.site h3,.site .serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.site a{color:inherit}
.s-head{position:sticky;top:0;z-index:5;background:rgba(245,239,230,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:56px}
.s-head .back{font-size:15px;color:var(--bur);cursor:pointer;white-space:nowrap}
.s-head .ttl{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:19px;color:var(--bur);cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-head .burger{display:none;font-size:22px;cursor:pointer;color:var(--bur);background:none;border:0}
.s-wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.s-hub{text-align:center;padding:56px 0 18px}
.s-eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:14px;font-weight:600;color:#4A3F3A}
.s-hub h1{font-size:46px;line-height:1.15;color:var(--bur);margin:8px 0 12px}
.s-lead{color:#4A3F3A;max-width:62ch;margin:0 auto;font-size:18px}
.s-intro{max-width:760px;margin:26px auto 0;color:#3E3431}
.s-intro h2{font-size:28px;color:var(--bur);margin-bottom:8px;text-align:center}
.s-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:30px 0 26px}
.s-tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 18px;font-size:16px;cursor:pointer;color:var(--ink);font-family:inherit}
.s-tab b{color:var(--bur);margin-left:6px}
.s-tab.on{background:var(--bur);border-color:var(--bur);color:#F5EFE6}.s-tab.on b{color:var(--gold)}
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:10px 0 36px}
.s-tile{background:var(--bur);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.s-tile:hover{transform:translateY(-2px)}
.s-tile.alt{background:var(--brown)}
.ph{aspect-ratio:3/2;position:relative;overflow:hidden;display:block}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:14px;left:14px;background:var(--tag);color:var(--gold);font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px}
.s-tile .bar{padding:22px 24px 20px;color:#F5EFE6;display:flex;align-items:flex-end;gap:12px;border-top:3px solid rgba(255,255,255,.08)}
.s-tile .bar div{flex:1}
.s-tile .bar h3{font-size:25px;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
.s-tile .bar small{display:block;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:14px;margin-top:6px}
.s-tile.alt .bar small{color:#CFC4B6}
.s-tile .arr{color:var(--gold);font-size:26px;line-height:1}
.s-page-h{padding:40px 0 4px;text-align:center}
.s-page-h .s-eyebrow{margin-bottom:6px}
.s-page-h h1{font-size:44px;color:var(--bur)}
.s-sec-h{font-family:"Playfair Display",Georgia,serif;font-size:28px;color:var(--bur);text-align:center;margin:44px 0 18px}
.s-cards .s-tile .bar h3{font-size:21px}
.s-svcs{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.s-svc{background:var(--paper);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column}
.s-svc h3{font-size:24px;color:var(--bur)}
.s-svc p{margin:8px 0 16px;color:#4A3F3A;flex:1}
.s-price{font-family:"Playfair Display",Georgia,serif;font-size:30px;color:var(--bur)}.s-price span{font-family:"Golos Text",system-ui,sans-serif;font-size:15px;color:var(--mute);margin-left:6px}
.s-btn{display:inline-block;background:var(--bur);color:#F5EFE6;border:0;padding:13px 26px;font:600 15px "Golos Text",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;text-align:center}
.s-btn.ghost{background:transparent;color:var(--bur);border:1px solid var(--bur)}
.s-svc .s-btn{margin-top:14px;align-self:flex-start}
.s-who{font-size:13px;color:var(--mute);margin-top:10px}
.s-pay{background:#EDE4D7;margin:44px 0;padding:30px 34px;display:flex;align-items:center;gap:24px}
.s-pay div{flex:1}.s-pay h3{font-size:26px;color:var(--bur)}.s-pay p{margin:6px 0 0;color:#4A3F3A}
.s-map{margin:10px 0 0;border:1px solid var(--line);aspect-ratio:21/8;background:repeating-linear-gradient(45deg,#ECE3D6 0 12px,#E6DCCD 12px 24px);display:grid;place-items:center;color:var(--mute);font-size:15px;text-align:center;padding:12px}
.s-foot{background:#2A1016;color:#D8CCBF;margin-top:50px;padding:36px 28px;font-size:14px}
.s-foot .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:20px}
.s-foot b{font-family:"Playfair Display",Georgia,serif;font-size:20px;color:#F5EFE6;font-weight:600}
.s-foot .docs a{display:block;cursor:pointer;color:var(--gold);text-decoration:none;margin-bottom:6px}
.s-foot .req{color:#A99B8E;margin-top:12px;font-size:13px}
.s-doc{max-width:760px;margin:0 auto;padding:44px 0}.s-doc h1{font-size:38px;color:var(--bur);margin-bottom:16px}
.s-cookie{position:sticky;bottom:0;z-index:6;background:#2A1016;color:#EDE4D7;display:flex;gap:14px;align-items:center;padding:12px 20px;font-size:14px}
.s-cookie span{flex:1}.s-cookie a{color:var(--gold);cursor:pointer}.s-cookie button{background:var(--gold);color:#2A1016;border:0;padding:8px 16px;font-weight:600;cursor:pointer}
.s-ov{position:absolute;inset:0;z-index:20;background:rgba(30,15,18,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.s-modal{background:var(--paper);width:640px;max-width:100%;max-height:100%;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.s-modal .x{position:absolute;top:10px;right:12px;font-size:26px;background:rgba(251,248,243,.9);border:0;cursor:pointer;color:var(--bur);width:36px;height:36px;border-radius:50%;z-index:2}
.s-modal .in{padding:24px 28px 28px}
.s-modal h2{font-size:30px;color:var(--bur)}.s-modal .sub{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin:4px 0 12px}
.s-place{background:#EDE4D7;padding:14px 16px;margin:16px 0}.s-place b{display:block;color:var(--bur);margin-bottom:4px}
.s-src{font-size:12px;color:var(--mute);margin:10px 0}
.s-phead{max-width:980px;margin:0 auto;padding:40px 0 0}
.s-ptop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px;align-items:start}
.s-phead .s-route{max-width:780px;margin:30px auto 8px}
.s-phead .s-eyebrow{margin-bottom:6px}
.s-phead h1{font-size:44px;color:var(--bur);margin:0 0 18px}
.s-phead .ph{border:1px solid var(--line)}
.s-ptext{color:#3E3431}
.s-ptext p{margin:0 0 12px}
.s-wines{max-width:900px;margin:0 auto 36px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.s-wine{background:#fff;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line)}
.s-wine.clk{cursor:pointer}.s-wine.clk:hover{box-shadow:0 8px 24px rgba(59,24,32,.12)}
.wph{aspect-ratio:4/5;background:#E6D8C3;display:grid;place-items:center;overflow:hidden}
.wph svg{height:88%;width:auto}
.wph.big{aspect-ratio:auto;height:320px}
.s-wine .wb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:3px;flex:1}
.s-wine h4{margin:0 0 4px;font:500 20px "Golos Text",system-ui,sans-serif;color:#7A5530}
.s-wine .wm{text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:#A08A72}
.s-wine .wt{font-weight:600;font-size:15px;margin-top:4px}
.s-wine .wg{font-size:15px;color:#7A6F68}
.s-wine .wp{font:600 22px "Golos Text",system-ui,sans-serif;margin-top:auto;padding-top:12px}
@container (max-width:767px){.s-ptop{grid-template-columns:1fr;gap:18px}}
@container (max-width:599px){.s-phead h1{font-size:32px}.s-wines{grid-template-columns:repeat(2,1fr);gap:12px}.s-wine .wb{padding:10px 10px 12px}.s-wine h4{font-size:16px}.s-wine .wm{font-size:11px}.s-wine .wt,.s-wine .wg{font-size:13px}.s-wine .wp{font-size:18px}}
.s-cardm{padding:0}
.s-cbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 18px;background:rgba(251,248,243,.97);border-bottom:1px solid var(--line);min-height:52px}
.s-cbar .bk{background:none;border:0;color:var(--bur);font:600 15px "Golos Text",system-ui,sans-serif;cursor:pointer;padding:6px 2px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.s-cbar .bk span{font-size:22px;line-height:1;margin-top:-2px}
.s-cbar .ct{flex:1;text-align:right;font-family:"Playfair Display",Georgia,serif;font-weight:600;color:var(--bur);font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-cbar .ct.show{opacity:1}
.s-cbar .xx{background:none;border:0;font-size:26px;color:var(--bur);cursor:pointer;width:34px;height:34px;line-height:1;flex:none}
.s-route{margin:22px 0 8px}
.s-route .lb{letter-spacing:.16em;text-transform:uppercase;font-size:13px;font-weight:600;color:#A67C3D}
.s-route p{margin:8px 0 14px}
.s-mapc{height:260px;border:1px solid var(--line);background:#ECE3D6;position:relative;z-index:0}
.s-mapc .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:14px;padding:12px}
.s-maphint{font-size:12px;color:var(--mute);margin-top:6px}
.s-route .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.s-route .btns .s-btn{width:100%;text-transform:none;letter-spacing:.02em;font-size:16px;padding:14px 12px}
@container (max-width:599px){.s-cbar .xx{display:none}.s-route .btns{grid-template-columns:1fr}.s-mapc{height:220px}.s-cbar{padding-left:14px}}
.s-paym{width:460px}
.s-paym .in{text-align:center}
.s-qr{width:170px;height:170px;margin:14px auto 6px;background:#fff;border:1px solid var(--line);padding:8px}
.s-paym .s-btn{display:block;width:100%;margin-top:10px}
.s-req{text-align:left;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.s-req summary{cursor:pointer;color:var(--bur);font-weight:600}
.s-req dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}.s-req dt{color:var(--mute)}.s-req dd{margin:0;word-break:break-all}
.s-note{font-size:12px;color:var(--mute);margin-top:12px}.s-note a{color:var(--bur);cursor:pointer}
.s-toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--bur2);color:#F5EFE6;padding:12px 18px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.s-menu{position:absolute;top:56px;right:0;left:0;z-index:7;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0}
.s-menu a{display:block;padding:10px 24px;cursor:pointer;text-decoration:none}
@container (max-width:1023px){.s-grid{grid-template-columns:repeat(2,1fr);gap:20px}.s-hub h1{font-size:38px}}
@container (max-width:599px){
 .site{font-size:16px}.s-head{padding:10px 16px}.s-head .burger{display:block}.s-wrap{padding:0 16px}
 .s-grid,.s-svcs{grid-template-columns:1fr;gap:16px}.s-hub{padding:32px 0 8px}.s-hub h1{font-size:31px}.s-lead{font-size:16px}
 .s-tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:22px -16px 18px;padding:0 16px}.s-tab{white-space:nowrap}
 .s-tile .bar h3{font-size:22px}.s-page-h h1{font-size:32px}.s-pay{flex-direction:column;align-items:flex-start;padding:22px}
 .s-foot .in{grid-template-columns:1fr}
 .s-ov{padding:0;align-items:stretch}.s-modal{width:100%;max-height:none}
 .s-ov.sheet{align-items:flex-end}.s-ov.sheet .s-modal{max-height:92%;border-radius:14px 14px 0 0}
}
.site [data-el].sel{outline:3px solid #B0414F;outline-offset:2px}
.site.pv [data-el]:hover{outline:1px dashed #B0414F;outline-offset:2px}

:root{--a-bg:#F1ECE5;--a-pan:#FFFFFF;--a-ink:#2A2522;--a-mute:#7A6F68;--a-line:#E3DBD0;--a-acc:#4A1F27;--a-acc2:#6B2C37;--a-soft:#F4E9EA;--a-ok:#2E7D4F;--a-bad:#B3261E}
html,body{margin:0;height:100%;background:var(--a-bg);color:var(--a-ink);font:400 14px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--a-pan);border-bottom:1px solid var(--a-line)}
.logo{width:30px;height:30px;border-radius:7px;background:var(--a-acc);color:#F5EFE6;display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-weight:700}
.top .nm{font-weight:600}.top .st{font-size:13px;color:var(--a-ok);margin-left:8px}.top .st.dirty{color:#A05A00}
.sp{flex:1}
.btn{border:1px solid var(--a-line);background:var(--a-pan);color:var(--a-ink);padding:7px 14px;border-radius:7px;cursor:pointer;font:500 13px "Golos Text",system-ui,sans-serif}
.btn.pri{background:var(--a-acc);border-color:var(--a-acc);color:#fff}.btn.pri:hover{background:var(--a-acc2)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.bad{color:var(--a-bad)}
.cols{display:grid;grid-template-columns:300px 420px 1fr;height:calc(100% - 54px - 26px)}
.tree,.form{background:var(--a-pan);border-right:1px solid var(--a-line);overflow:auto}
.secs{padding:12px;border-bottom:1px solid var(--a-line);background:#FAF7F3}
.secs .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--a-mute);margin-bottom:8px;display:flex;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--a-line);background:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.pill.on{background:var(--a-acc);border-color:var(--a-acc);color:#fff}.pill.off{opacity:.5}
.pill.add{border-style:dashed;color:var(--a-acc)}
.tw{padding:8px 6px 20px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--a-mute);padding:12px 10px 4px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;user-select:none}
.row:hover{background:#F7F2EC}.row.sel{background:var(--a-soft);box-shadow:inset 3px 0 0 var(--a-acc)}
.row .h{color:#B9AEA4;cursor:grab;font-size:12px;width:12px}
.row .tg{width:14px;color:var(--a-mute);font-size:11px}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--a-ok);flex:none}.row .dot.no{background:transparent;border:1px solid #B9AEA4}
.row .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ty{font-size:11px;color:var(--a-mute);white-space:nowrap}
.row .ic{color:#B9AEA4;font-size:12px;padding:0 2px}.row .ic:hover{color:var(--a-acc)}
.row.hid .lb{opacity:.45}
.kids{margin-left:16px;border-left:1px dashed var(--a-line);padding-left:4px}
.addel{color:var(--a-acc);font-size:13px;padding:6px 10px;cursor:pointer}
.menu{background:#fff;border:1px solid var(--a-line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin:2px 8px 8px;padding:4px}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer}.menu div:hover{background:#F7F2EC}.menu div.dis{color:#C2B8AE;cursor:not-allowed}
.form .in{padding:18px 20px 40px}
.crumb{font-size:12px;color:var(--a-mute)}.ftitle{font-family:"Playfair Display",Georgia,serif;font-size:21px;margin:2px 0 14px;color:var(--a-acc)}
.fld{margin-bottom:14px}.fld>label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px}
.fld>label i{font-style:normal;font-weight:400;color:var(--a-mute)}.fld>label i.over{color:var(--a-bad)}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{width:100%;border:1px solid var(--a-line);border-radius:7px;padding:8px 10px;font:inherit;color:inherit;background:#fff}
.fld textarea{min-height:80px;resize:vertical}
.hintx{font-size:12px;color:var(--a-mute);margin-top:4px}
.sw{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}.sw input{accent-color:var(--a-acc)}
.seg{display:flex;border:1px solid var(--a-line);border-radius:8px;overflow:hidden;margin-bottom:6px}.seg label{flex:1;text-align:center;padding:7px;cursor:pointer;font-size:13px}.seg input{display:none}.seg label:has(input:checked){background:var(--a-acc);color:#fff}
.box{border:1px solid var(--a-line);border-radius:9px;padding:12px;margin-bottom:12px;background:#FCFAF7}
.box h4{margin:0 0 10px;font-size:13px}
.pm{display:grid;grid-template-columns:14px 18px 1fr auto;gap:8px;align-items:center;border:1px solid var(--a-line);border-radius:8px;padding:8px;margin-bottom:6px;background:#fff}
.pm .h{cursor:grab;color:#B9AEA4}.pm .nm2{font-weight:600}.pm .sub{grid-column:3/5}
.pm input[type=text]{width:100%;border:1px solid var(--a-line);border-radius:6px;padding:6px 8px;font:inherit;margin-top:4px}
.photo{display:flex;gap:10px;align-items:center}.photo .th{width:120px;aspect-ratio:3/2;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--a-line)}
.pvcol{display:flex;flex-direction:column;overflow:hidden}
.pvbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--a-pan);border-bottom:1px solid var(--a-line);font-size:12px;color:var(--a-mute)}
.dv{display:flex;gap:3px;background:#F3EEE8;padding:3px;border-radius:7px}.dv button{border:0;background:transparent;padding:4px 10px;border-radius:5px;cursor:pointer;font:500 12px "Golos Text",system-ui,sans-serif;color:var(--a-ink)}.dv button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pvst{flex:1;display:flex;justify-content:center;padding:14px;overflow:hidden}
.frm{background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.12);transform-origin:top center;flex:none;border-radius:6px;overflow:hidden}
.foot{height:26px;font-size:11px;color:var(--a-mute);display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--a-line);background:var(--a-pan)}
.toastA{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--a-acc);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-size:13px}
.drag-over{outline:2px dashed var(--a-acc)}
.new{display:inline-block;font-size:10px;background:#F6E7C8;color:#7A5300;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;font-weight:600}

/* ===== 2.0: сайт ===== */
.site a.s-tile{text-decoration:none;color:#F5EFE6}
.s-tile.nolink{cursor:default}.s-tile.nolink:hover{transform:none}
.s-tile .bar{flex:1;align-items:stretch}
.s-tile .bar div{display:flex;flex-direction:column}
.s-tile .bar h3,.s-tile .bar small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-tile .arr{align-self:flex-end;font-family:"Golos Text",system-ui,sans-serif;font-size:28px;font-weight:400}

function walk(fn){

  if(b.type==='tabs')b.tabs.forEach(t=>{fn(t,b.tabs,b,ctx);visit(t.blocks,t,{kind:'tab',level:1,tab:t,page:null,path:[...ctx.path,t.title]})});
  if(b.type==='tiles')b.items.forEach(t=>{const c={...ctx,tb:b};fn(t,b.items,b,c);if(ctx.level===1&&b.kind!=='wine')visit(t.blocks,t,{kind:'page',level:2,tab:ctx.tab,page:t,path:[...ctx.path,t.title]})});
 });
 visit(D.home,null,{kind:'home',level:1,tab:null,page:null,path:['Главная']});
}
function find(id){let r=null;walk((n,list,owner,ctx)=>{if(!r&&n.id===id)r={n,list,owner,ctx}});return r}

const isWine=(ctx)=>ctx&&ctx.tb&&ctx.tb.kind==='wine';
function tileMode(t,ctx){
 if(isWine(ctx))return t.text?'popup':'none';
 if(ctx.level===1){if(t.blocks.some(b=>b.on))return 'page';if(t.asPage)return 'static'}

}

 return `${qr?`<div class="s-qr">${qrSVG(hash(pay.recipient||'x'))}</div><div class="s-note" style="margin-top:0">Наведите камеру телефона на код</div>`:''}${links.map((m,i)=>`<button class="s-btn ${i?'ghost':''}" data-act="paylink" data-label="${esc(m.label||CAT[m.p][1])}">${esc(m.label||CAT[m.p][1])}</button>`).join('')}${rq?`<details class="s-req"><summary>Реквизиты для перевода</summary><dl>${REQF[fs.fmt].filter(([k])=>rq.req[k]).map(([k,l])=>`<dt>${l}</dt><dd>${esc(rq.req[k])}</dd>`).join('')}</dl><button class="s-btn ghost" data-act="copy">Скопировать реквизиты</button></details>`:''}${D.docs.offer.on?`<div class="s-note">Нажимая кнопку, вы соглашаетесь с <a data-act="doc" data-doc="offer">офертой</a></div>`:''}`}

function mountSite(root){root.classList.add('site','pv');let lastKey='';
 const draw=()=>{const sc=root.querySelector('.s-scroll');const key=[pst.host,pst.tab,pst.page,pst.doc].join('|');const top=sc&&key===lastKey?sc.scrollTop:0;lastKey=key;
  root.innerHTML=`<div class="s-scroll">${renderSite()}</div>${overlayHTML()}${pst.toast?`<div class="s-toast">${esc(pst.toast)}</div>`:''}`;
  root.querySelector('.s-scroll').scrollTop=top;
  const e=A.sel&&root.querySelector(`.s-scroll [data-el="${CSS.escape(A.sel)}"]`);if(e){e.classList.add('sel');if(A.scroll){A.scroll=false;const s=root.querySelector('.s-scroll');s.scrollTop=Math.max(0,Math.min(e.offsetTop-s.clientHeight/2+e.offsetHeight/2,e.offsetTop-80))}}else A.scroll=false;
  const m=root.querySelector('.s-cardm');if(m){const ct=m.querySelector('.ct'),h=m.querySelector('h2');m.addEventListener('scroll',()=>ct.classList.toggle('show',h.getBoundingClientRect().bottom<m.getBoundingClientRect().top+52))}};
 const toast=t=>{pst.toast=t;draw();clearTimeout(pst._t);pst._t=setTimeout(()=>{pst.toast='';draw()},2200)};
 root.onclick=e=>{const a=e.target.closest('[data-act]');const elx=e.target.closest('.s-scroll [data-el]');
  if(e.target.closest('[data-stop]')&&a&&a.dataset.act==='close'&&!e.target.closest('.x,.bk,.xx'))return;
  if(elx&&!(a&&['tab','home','close','burger','doc'].includes(a.dataset.act)))selectFromPreview(elx.dataset.el);
  if(!a)return;const d=a.dataset;
  switch(d.act){
   case 'tab':pst.tab=d.slug;pst.menu=false;selectFromPreview(d.el||a.dataset.el);break;
   case 'page':{pst.pop=null;pst.page=d.id;pst.menu=false;pst.doc=null;break}
   case 'pop':pst.pop=d.id;pst.menu=false;break;
   case 'pop2':pst.page=d.pg;pst.pop=d.id;break;
   case 'home':pst.page=null;pst.pop=null;pst.doc=null;pst.pay=null;break;
   case 'close':pst.pop=null;pst.pay=null;break;
   case 'pay':pst.pay=d.id;break;
   case 'burger':pst.menu=!pst.menu;break;
   case 'doc':pst.doc=d.doc;pst.pay=null;pst.page=null;break;
   case 'cookie':pst.cookieOk=true;break;
   case 'svc':return toast('Откроется страница оплаты получателя в новой вкладке');
   case 'paylink':return toast('«'+d.label+'» — откроется оплата в новой вкладке');
   case 'copy':return toast('Скопировано');
   case 'route':return toast('Маршрут откроется в картах (новая вкладка или приложение)');
   case 'mapopen':return toast('Точка откроется в картах');
  }
  draw()};
 return {draw}}

const A={sel:'hero',open:{'tabs':true,'tab-ge':true,'ge-tiles':true},add:null,dirty:false,errors:[],scroll:false};
const $=s=>document.querySelector(s);
function toast(t){const d=document.createElement('div');d.className='toastA';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function dirty(v=true){A.dirty=v;const s=$('#st');s.textContent=v?'Есть несохранённые изменения':'Все изменения сохранены';s.classList.toggle('dirty',v)}
function blockLabel(b){if(b.type==='text')return b.title||b.eyebrow||(b.body?b.body.slice(0,28)+'…':'Текст');if(b.type==='photo')return b.caption||'Фото';if(b.type==='tiles')return b.title||'Плитки';if(b.type==='map')return b.title||'Карта';if(b.type==='pay'||b.type==='service')return b.title||TN[b.type];return TN[b.type]}
function rowHTML(id,label,type,o={}){return `<div class="row ${A.sel===id?'sel':''} ${o.hid?'hid':''} ${o.cls||''}" data-id="${id}" ${o.drag?`draggable="true" data-dnd="${o.drag}"`:''}><span class="h">${o.drag?'⋮⋮':''}</span>${o.tog?`<span class="tg" data-tog="${id}">${A.open[id]?'▾':'▸'}</span>`:`<span class="dot ${o.photo===false?'no':''}" style="${o.photo==null?'visibility:hidden':''}"></span>`}<span class="lb">${o.bold?'<b>':''}${esc(label)}${o.bold?'</b>':''}</span><span class="ty">${esc(type)}</span>${o.ctl?`<span class="ic" data-hide="${id}" title="Скрыть / показать">${o.hid?'◌':'◉'}</span><span class="ic" data-del="${id}" title="Удалить">✕</span>`:''}</div>`}
function addMenuHTML(key,kind,list){
 if(A.add!==key)return `<div class="addel" data-add="${key}">+ Добавить блок</div>`;
 const why=t=>{if(t==='tabs'){if(kind!=='home')return 'Только на главной';if(tabsBlock())return 'Уже есть на сайте'}if((t==='map'||t==='pay')&&list.some(b=>b.type===t))return 'Уже есть на этой странице';return ''};
 return `<div class="addel" data-add="">− Скрыть выбор</div><div class="menu" data-menu="${key}">${Object.keys(TN).map(t=>{const w=why(t);return `<div class="${w?'dis':''}" data-addtype="${t}" data-key="${key}"><span class="tn">${TN[t]}</span><small>${w||ADDHINT[t]}</small></div>`}).join('')}</div>`}
function treeBlocks(list,ownerId,kind,level){let h='';
 list.forEach(b=>{const drag=b.type==='tabs'?'':ownerId;
  if(b.type==='tiles'){h+=rowHTML(b.id,blockLabel(b),`${b.kind==='wine'?'вина':b.size==='large'?'крупные':'компактные'} · ${b.aspect}`,{tog:1,drag,ctl:1,hid:!b.on,cls:'blk',bold:1});
   if(A.open[b.id]){h+=`<div class="kids">`+b.items.map(t=>tileRow(t,b,level)).join('')+`<div class="addel tile" data-addtile="${b.id}">+ Добавить ${b.kind==='wine'?'вино':'плитку'}</div></div>`}}
  else if(b.type==='tabs'){h+=rowHTML(b.id,'Табы',plural(b.tabs.length,'таб','таба','табов'),{tog:1,ctl:1,hid:!b.on,cls:'blk',bold:1});
   if(A.open[b.id]){h+=`<div class="kids">`+b.tabs.map(t=>{let r=rowHTML(t.id,t.title,'Таб · '+visTiles(t.blocks),{tog:1,drag:b.id,ctl:1,hid:!t.on});if(A.open[t.id])r+=`<div class="kids">${treeBlocks(t.blocks,t.id,'tab',1)}</div>`;return r}).join('')+`<div class="addel" data-addtab="1">+ Таб</div></div>`}}
  else h+=rowHTML(b.id,blockLabel(b),TN[b.type],{drag,ctl:1,hid:!b.on,cls:'blk'});
 });
 h+=addMenuHTML(ownerId,kind,list);return h}
function tileRow(t,tb,level){const wine=tb.kind==='wine';const m=tileMode(t,{tb,level});
 const n=t.blocks.length;const ty=wine?'Вино':m==='page'?'Страница · '+n:m==='static'?'Страница · статичная':m==='popup'?'Поп-ап':'Не нажимается';
 if(wine||level===2)return rowHTML(t.id,t.title,ty,{drag:tb.id,ctl:1,hid:!t.on,photo:!!t.photo});
 let r=rowHTML(t.id,t.title,ty,{tog:1,drag:tb.id,ctl:1,hid:!t.on});
 if(A.open[t.id])r+=`<div class="kids">${n?'':`<div class="empty">Блоков нет. Добавьте блок — плитка станет страницей</div>`}${treeBlocks(t.blocks,t.id,'page',2)}</div>`;
 return r}

 $('#tree').innerHTML=h+`</div>`}

 const m=modal(`<div class="mbox ed"><div class="eh"><h3>Редактор фото · рамка ${r}</h3><button class="btn sm" data-mclose="1">×</button></div><div class="eb"><div class="stage" id="stage"><div class="imgw" id="imgw">${img}</div><div class="frame" style="width:${fw}px;height:${fh}px"></div></div><div class="side"><h4>Как будет выглядеть</h4>Компьютер${mini(3,240)}Планшет${mini(2,180)}Телефон${mini(1,100)}<div style="margin-top:10px">Тексты и настройки при замене фото не меняются</div></div></div><div class="tools" id="tools"><span>Масштаб</span><input type="range" min="1" max="4" step="0.05" value="1" id="zoom"><button class="btn sm" id="rot">Повернуть на 90°</button><button class="btn sm" id="rst">Сбросить</button><span class="hintx" style="margin:0">Перетащите фото мышью, чтобы главное попало в рамку. Колесо мыши тоже меняет масштаб</span></div><div class="ef"><span class="hintx">Итог: ${r==='4:5'?'1200×1500':'1600×1067'} px, JPEG, сжатие автоматически</span><button class="btn" data-mclose="1">Отмена</button><button class="btn pri" id="apply">Применить</button></div></div>`);
 const upd=()=>{const tr=`translate(${ED.x}px,${ED.y}px) scale(${ED.s}) rotate(${ED.r}deg)`;m.querySelector('#imgw').style.transform=tr;m.querySelectorAll('.mimg').forEach(e=>e.style.transform=`translate(${ED.x/8}px,${ED.y/8}px) scale(${ED.s*1.0}) rotate(${ED.r}deg)`);m.querySelector('#zoom').value=ED.s};
 const st=m.querySelector('#stage');let dr=null;st.onmousedown=e=>{dr={x:e.clientX-ED.x,y:e.clientY-ED.y}};addEventListener('mousemove',e=>{if(dr){ED.x=e.clientX-dr.x;ED.y=e.clientY-dr.y;upd()}});addEventListener('mouseup',()=>dr=null);
 st.onwheel=e=>{e.preventDefault();ED.s=Math.min(4,Math.max(1,ED.s-e.deltaY/500));upd()};
 m.querySelector('#zoom').oninput=e=>{ED.s=+e.target.value;upd()};m.querySelector('#rot').onclick=()=>{ED.r=(ED.r+90)%360;ED.s=Math.max(ED.s,ED.r%180?1.5:1);upd()};m.querySelector('#rst').onclick=()=>{Object.assign(ED,{x:0,y:0,s:1,r:0});upd()};
 m.querySelector('#apply').onclick=()=>{m.remove();if(fresh)n.photo={hue:(hash(n.id+Date.now())*7)%360};dirty();all();toast('Кадр применён')};
 window.__ed=m;return m}

// ---------- события ----------
$('#tree').addEventListener('click',e=>{const t=e.target;
 if(t.dataset.tog){A.open[t.dataset.tog]=!A.open[t.dataset.tog];return drawTree()}
 if(t.dataset.expand){walk(n=>{if(n.type==='tiles'||n.type==='tabs'||n.type==='tab'||(n.type==='tile'&&n.blocks.length))A.open[n.id]=true});return drawTree()}
 if(t.dataset.collapse){A.open={};return drawTree()}
 if(t.dataset.hide){const f=find(t.dataset.hide);f.n.on=!f.n.on;dirty();all();return toast(f.n.on?'Снова видно на сайте':'Скрыто: посетители не видят, данные сохраняются')}
 if(t.dataset.del)return askDelete(t.dataset.del);
 if(t.dataset.add!=null){A.add=t.dataset.add||null;return drawTree()}
 const at=t.closest('[data-addtype]');if(at){if(at.classList.contains('dis'))return toast(at.querySelector('small').textContent);return addBlock(at.dataset.key,at.dataset.addtype)}
 if(t.dataset.addtile)return addTile(t.dataset.addtile);
 if(t.dataset.addtab)return addTab();
 const r=t.closest('.row');if(r)select(r.dataset.id)});
$('#form').addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;let v=t.dataset.bool?t.checked:t.dataset.num?(t.value===''?'':+t.value):t.value;setP(FN,t.dataset.f,v);
 const c=document.querySelector(`[data-cnt="${CSS.escape(t.dataset.f)}"]`);if(c){c.textContent=String(v).length+' / '+t.dataset.max;c.classList.toggle('over',String(v).length>+t.dataset.max)}
 dirty();clearTimeout(A._t);A._t=setTimeout(()=>{drawTree();pv.draw();if(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='radio')drawForm();$('#nm').textContent=D.site.title},300)});
$('#form').addEventListener('change',e=>{const t=e.target;if(t.dataset.addpm){if(!t.value)return;const c=CAT[t.value];const m={p:t.value,on:true};if(c[0]==='link'){m.url='';m.label=''}if(t.value==='requisites')m.req={purpose:'Пожертвование'};FN.methods.push(m);dirty();drawForm();pv.draw()}});
$('#form').addEventListener('click',e=>{const t=e.target.closest('[data-toast],[data-gopage],[data-show],[data-delpm],[data-adddom],[data-deldom],[data-addown],[data-goid],[data-goerr],[data-delbtn],[data-editor],[data-upload],[data-nophoto],[data-addtile],[data-addtab],[data-addinto],[data-import]');if(!t)return;const d=t.dataset;
 if(d.toast)toast(d.toast);
 if(d.gopage){pst.page=d.gopage;pst.pop=null;pv.draw()}
 if(d.show){const f=find(d.show);pst.page=f.ctx.page?f.ctx.page.id:null;pst.pop=d.show;pv.draw()}
 if(d.delpm!=null){FN.methods.splice(+d.delpm,1);dirty();drawForm();pv.draw()}
 if(d.adddom){D.domains.push({host:'new.obiteli.site',mode:'all',title:'Новый адрес'});dirty();drawForm();fillDom()}
 if(d.deldom!=null){if(D.domains.length<2)return toast('Нужен хотя бы один адрес');D.domains.splice(+d.deldom,1);dirty();drawForm();fillDom()}
 if(d.addown){D.owners.push({id:D.owners.length+1,name:'Новый владелец',country:'RU',tax:'',reg:'',addr:'',email:''});dirty();drawForm()}
 if(d.goid||d.goerr)select(d.goid||d.goerr);
 if(d.delbtn)askDelete(A.sel);
 if(d.editor)openEditor(FN);
 if(d.upload){toast('Выбор файла на компьютере…');setTimeout(()=>openEditor(FN,true),400)}
 if(d.nophoto){FN.photo=null;dirty();all()}
 if(d.addtile)addTile(d.addtile);
 if(d.addtab)addTab();
 if(d.addinto){A.open[d.addinto]=true;A.add=d.addinto;drawTree();toast('Выберите тип блока в дереве слева')}
 if(d.import)confirmBox('Загрузить сайт из ZIP?','Текущий сайт будет заменён. Перед этим копия базы сохранится сама.','Заменить сайт',()=>toast('Сайт загружен из ZIP'))});
let drag=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest('[data-dnd]');if(!d)return;drag=d;e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-dnd]');if(drag&&d&&d.dataset.dnd===drag.dataset.dnd){e.preventDefault();d.classList.add('drag-over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-dnd]');d&&d.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-dnd]');if(!drag||!d||d.dataset.dnd!==drag.dataset.dnd)return;e.preventDefault();d.classList.remove('drag-over');
 const g=drag.dataset.dnd;
 if(g==='pm'||g==='soc'){const arr=g==='pm'?FN.methods:D.site.socials;const a=+drag.dataset.i,b=+d.dataset.i;arr.splice(b,0,arr.splice(a,1)[0])}
 else{const fa=find(drag.dataset.id),fb=find(d.dataset.id);if(fa&&fb&&fa.list===fb.list){const l=fa.list;l.splice(l.indexOf(fb.n),0,l.splice(l.indexOf(fa.n),1)[0]);const ti=D.home.findIndex(x=>x.type==='tabs');if(ti>=0&&ti!==D.home.length-1)D.home.push(D.home.splice(ti,1)[0])}}
 drag=null;dirty();all()});
function validate(){const er=[];walk((n,list,owner,ctx)=>{const lim=n.type==='tile'?(isWine(ctx)?LIM.wine:LIM.tile):LIM[n.type];const nm=n.type==='tile'||n.type==='tab'?n.title:blockLabel(n);
 if(lim)for(const k in lim)if(String(n[k]??'').length>lim[k])er.push({id:n.id,msg:`«${nm}»: поле длиннее ${lim[k]} знаков`});
 if(n.type==='tile'&&(!!n.lat!==!!n.lng))er.push({id:n.id,msg:`«${nm}»: нужны и широта, и долгота`});
 if(n.type==='service'&&n.on&&!n.url)er.push({id:n.id,msg:`«${nm}»: у видимой услуги нет ссылки на оплату`});
 if(n.type==='tab'&&!/^[a-z0-9-]{1,40}$/.test(n.slug))er.push({id:n.id,msg:`Таб «${nm}»: slug — только латиница, цифры, дефис`})});return er}
$('#save').onclick=()=>{A.errors=validate();if(A.errors.length){drawForm();return toast('Не сохранено: исправьте ошибки над формой')}dirty(false);drawForm();toast('Сохранено — изменения сразу на сайте')};
$('#open').onclick=()=>toast('Сайт откроется в новой вкладке');
$('#dv').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));PW=+b.dataset.w;fit()};
function fillDom(){$('#pvdom').innerHTML=D.domains.map(d=>`<option value="${esc(d.host)}">${esc(d.host)}</option>`).join('');$('#pvdom').value=pst.host}
$('#pvdom').onchange=e=>{pst.host=e.target.value;pst.page=null;pst.pop=null;pv.draw()};
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();$('#save').click()}});
addEventListener('resize',fit);fillDom();routeFor(A.sel);all();fit();

window.DEMO={select,find,D,A,pst,all,addBlock,
 device(w){document.querySelector(`#dv button[data-w="${w}"]`).click()},
 openAdd(key){A.add=key;A.open[key]=true;ancestors(key).forEach(a=>A.open[a]=true);drawTree()},
 pv(o){Object.assign(pst,o);pv.draw()},
 editor(id){return openEditor(find(id).n)},
 askDelete,validate,
 save(){$('#save').click()},
 clear(){document.querySelectorAll('.hb,.hbox,.mo,.toastA').forEach(x=>x.remove())},
 badges(list){document.querySelectorAll('.hb,.hbox').forEach(x=>x.remove());list.forEach(([sel,n,pos,box])=>{const el=typeof sel==='string'?document.querySelector(sel):sel;if(!el){console.warn('нет',sel);return}const r=el.getBoundingClientRect();
  if(box){const b=document.createElement('div');b.className='hbox';Object.assign(b.style,{left:r.left-3+'px',top:r.top-3+'px',width:r.width+6+'px',height:r.height+6+'px'});document.body.appendChild(b)}
  const d=document.createElement('div');d.className='hb';d.textContent=n;const p=pos||'l';let x=r.left-30,y=r.top+r.height/2-13;
  if(p==='r')x=r.right+4;if(p==='c')x=r.left+r.width/2-13;if(p==='a'){x=r.left+r.width/2-13;y=r.top-28}if(p==='b'){x=r.left+r.width/2-13;y=r.bottom+2}if(p==='tl'){x=r.left-10;y=r.top-10}if(p==='tr'){x=r.right-16;y=r.top-10}
  d.style.left=Math.max(2,x)+'px';d.style.top=Math.max(2,y)+'px';document.body.appendChild(d)})}};
