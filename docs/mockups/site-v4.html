 const toast=t=>{st.toast=t;draw();clearTimeout(st._tt);st._tt=setTimeout(()=>{st.toast='';draw()},2200)};
 root.onclick=e=>{
  const a=e.target.closest('[data-act]');const elx=e.target.closest('[data-el]');
  if(e.target.closest('[data-stop]')&&a&&a.dataset.act==='close'&&!e.target.closest('.x,.s-btn,.bk,.xx'))return;
  if(opts.preview&&elx&&opts.onSelect&&!(a&&['tab','home','close','burger'].includes(a.dataset.act)))opts.onSelect(elx.dataset.el);
  if(!a)return;const d=a.dataset;
  switch(d.act){
   case 'tab':st.section=d.sec;st.tcard=null;st.menu=false;break;
   case 'open':st.tcard=null;st.wine=null;st.page=d.slug;st.card=null;st.menu=false;break;
   case 'home':st.tcard=null;st.wine=null;st.page=null;st.doc=null;st.card=null;st.pay=null;break;
   case 'card':st.card=+d.i;break;
   case 'close':st.card=null;st.pay=null;st.tcard=null;st.wine=null;break;
   case 'tcard':st.tcard=d.slug;st.menu=false;break;
   case 'wine':st.wine=+d.i;break;
   case 'pay':st.pay=d.pay;break;
   case 'burger':st.menu=!st.menu;break;
   case 'doc':st.doc=d.doc;st.pay=null;st.page=null;break;
   case 'cookie':st.cookieOk=true;break;
   case 'svc':return toast('Демо: откроется страница оплаты монастыря в новой вкладке');
   case 'paylink':return toast('Демо: «'+d.label+'» — откроется оплата в новой вкладке');
   case 'copy':return toast('Скопировано');
   case 'route':return toast('Демо: маршрут до точки в '+(curSec(st).maps==='yandex'?'Яндекс Картах':'Google Картах')+' (новая вкладка / приложение карт)');
   case 'mapopen':return toast('Демо: точка откроется в '+MAPS[curSec(st).maps||'google']);
  }
  if(opts.onRoute)opts.onRoute();draw();
 };
 draw();return {draw};
}
