.s-route{margin:22px 0 8px}
.s-route .lb{letter-spacing:.16em;text-transform:uppercase;font-size:13px;font-weight:600;color:#A67C3D}
.s-route p{margin:8px 0 14px}
.s-mapc{height:260px;border:1px solid var(--line);background:#ECE3D6;position:relative;z-index:0}

.s-req{text-align:left;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.s-req summary{cursor:pointer;color:var(--bur);font-weight:600}
.s-req dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}.s-req dt{color:var(--mute)}.s-req dd{margin:0;word-break:break-all}
.s-note{font-size:12px;color:var(--mute);margin-top:12px}.s-note a{color:var(--bur);cursor:pointer}
.s-toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--bur2);color:#F5EFE6;padding:12px 18px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.s-menu{position:absolute;top:56px;right:0;left:0;z-index:7;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0}
.s-menu a{display:block;padding:10px 24px;cursor:pointer;text-decoration:none}
@container (max-width:1023px){.s-grid{grid-template-columns:repeat(2,1fr);gap:20px}.s-hub h1{font-size:38px}}
@container (max-width:599px){
 .site{font-size:16px}.s-head{padding:10px 16px}.s-head .burger{display:block}.s-wrap{padding:0 16px}
 .s-grid,.s-svcs{grid-template-columns:1fr;gap:16px}.s-hub{padding:32px 0 8px}.s-hub h1{font-size:31px}.s-lead{font-size:16px}
 .s-tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:22px -16px 18px;padding:0 16px}.s-tab{white-space:nowrap}
 .s-tile .bar h3{font-size:22px}.s-page-h h1{font-size:32px}.s-pay{flex-direction:column;align-items:flex-start;padding:22px}
 .s-foot .in{grid-template-columns:1fr}
 .s-ov{padding:0;align-items:stretch}.s-modal{width:100%;max-height:none}
 .s-ov.sheet{align-items:flex-end}.s-ov.sheet .s-modal{max-height:92%;border-radius:14px 14px 0 0}
}
.site [data-el].sel{outline:3px solid #B0414F;outline-offset:2px}

:root{--a-bg:#F1ECE5;--a-pan:#FFFFFF;--a-ink:#2A2522;--a-mute:#7A6F68;--a-line:#E3DBD0;--a-acc:#4A1F27;--a-acc2:#6B2C37;--a-soft:#F4E9EA;--a-ok:#2E7D4F;--a-bad:#B3261E}
html,body{margin:0;height:100%;background:var(--a-bg);color:var(--a-ink);font:400 14px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--a-pan);border-bottom:1px solid var(--a-line)}
.logo{width:30px;height:30px;border-radius:7px;background:var(--a-acc);color:#F5EFE6;display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-weight:700}
.top .nm{font-weight:600}.top .st{font-size:13px;color:var(--a-ok);margin-left:8px}.top .st.dirty{color:#A05A00}
.sp{flex:1}
.btn{border:1px solid var(--a-line);background:var(--a-pan);color:var(--a-ink);padding:7px 14px;border-radius:7px;cursor:pointer;font:500 13px "Golos Text",system-ui,sans-serif}
.btn.pri{background:var(--a-acc);border-color:var(--a-acc);color:#fff}.btn.pri:hover{background:var(--a-acc2)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.bad{color:var(--a-bad)}
.cols{display:grid;grid-template-columns:300px 420px 1fr;height:calc(100% - 54px - 26px)}
.tree,.form{background:var(--a-pan);border-right:1px solid var(--a-line);overflow:auto}
.secs{padding:12px;border-bottom:1px solid var(--a-line);background:#FAF7F3}
.secs .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--a-mute);margin-bottom:8px;display:flex;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--a-line);background:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.pill.on{background:var(--a-acc);border-color:var(--a-acc);color:#fff}.pill.off{opacity:.5}
.pill.add{border-style:dashed;color:var(--a-acc)}
.tw{padding:8px 6px 20px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--a-mute);padding:12px 10px 4px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;user-select:none}

.row .h{color:#B9AEA4;cursor:grab;font-size:12px;width:12px}

.row .dot{width:8px;height:8px;border-radius:50%;background:var(--a-ok);flex:none}.row .dot.no{background:transparent;border:1px solid #B9AEA4}
.row .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ty{font-size:11px;color:var(--a-mute);white-space:nowrap}
.row .ic{color:#B9AEA4;font-size:12px;padding:0 2px}.row .ic:hover{color:var(--a-acc)}
.row.hid .lb{opacity:.45}
.kids{margin-left:16px;border-left:1px dashed var(--a-line);padding-left:4px}
.addel{color:var(--a-acc);font-size:13px;padding:6px 10px;cursor:pointer}
.menu{background:#fff;border:1px solid var(--a-line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin:2px 8px 8px;padding:4px}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer}.menu div:hover{background:#F7F2EC}.menu div.dis{color:#C2B8AE;cursor:not-allowed}
.form .in{padding:18px 20px 40px}
.crumb{font-size:12px;color:var(--a-mute)}.ftitle{font-family:"Playfair Display",Georgia,serif;font-size:21px;margin:2px 0 14px;color:var(--a-acc)}
.fld{margin-bottom:14px}.fld>label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px}
.fld>label i{font-style:normal;font-weight:400;color:var(--a-mute)}.fld>label i.over{color:var(--a-bad)}

.pm .h{cursor:grab;color:#B9AEA4}.pm .nm2{font-weight:600}.pm .sub{grid-column:3/5}

.dv{display:flex;gap:3px;background:#F3EEE8;padding:3px;border-radius:7px}.dv button{border:0;background:transparent;padding:4px 10px;border-radius:5px;cursor:pointer;font:500 12px "Golos Text",system-ui,sans-serif;color:var(--a-ink)}.dv button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.toastA{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--a-acc);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-size:13px}
.drag-over{outline:2px dashed var(--a-acc)}
.new{display:inline-block;font-size:10px;background:#F6E7C8;color:#7A5300;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;font-weight:600}
</style></head><body>

// ---------- preview ----------
let PW=1280;
function routeFor(id){const g=get(id);if(g.sec){pst.section=g.sec.slug;A.sec=g.sec.slug}
 if(['intro','c','svc','don','w'].includes(g.k)){pst.page=g.t.slug;pst.doc=null}else if(g.k==='t'&&g.t&&g.t.open==='page'&&false){}else if(['t','map','pay','sec','hub'].includes(g.k)){pst.page=null;pst.doc=null}
 pst.card=null;pst.pay=null;pst.tcard=null;pst.wine=null;
 const d=DATA.domains.find(x=>x.host===pst.host);if(d.mode!=='all'&&g.sec&&d.mode!==g.sec.slug){pst.host=DATA.domains.find(x=>x.mode==='all').host;$('#pvdom').value=pst.host}}
const pv=mountSite($('#pv'),pst,{preview:true,getSel:()=>A.sel,onSelect:id=>{if(id==='tabs')id='sec:'+pst.section;A.sel=id;if(get(id).t)A.open[get(id).t.slug]=true;drawTree();drawForm()},onRoute:()=>{if(pst.section!==A.sec){A.sec=pst.section;drawTree()}}});
function fit(){const st=$('#pvst'),f=$('#frm');const H=Math.max(st.clientHeight-28,400);f.style.width=PW+'px';const sc=Math.min(1,(st.clientWidth-28)/PW);f.style.height=(H/sc)+'px';f.style.transform=`scale(${sc})`}
function all(){drawTree();drawForm();pv.draw();$('#nm').textContent=DATA.domains[0].title}
// ---------- events ----------
$('#tree').addEventListener('click',e=>{const t=e.target;
 if(t.dataset.tog){A.open[t.dataset.tog]=!A.open[t.dataset.tog];return drawTree()}
 if(t.dataset.hide){const g=get(t.dataset.hide);if(g.k==='svc')g.t.services[g.i].on=!g.t.services[g.i].on;else if(g.k==='don')g.t.donate.on=!g.t.donate.on;else if(g.k==='pay')g.sec.support.on=!g.sec.support.on;else toast('Скрыто — посетители не видят, данные сохраняются');dirty();return all()}
 if(t.dataset.del){return toast('Удалить «'+(t.closest('.row').querySelector('.lb').textContent)+'»? — подтверждение')}
 if(t.dataset.sec){A.sec=t.dataset.sec;pst.section=A.sec;pst.page=null;A.sel='sec:'+A.sec;routeFor(A.sel);return all()}
 if(t.dataset.newsec){const n=DATA.sections.length+1;DATA.sections.push({slug:'razdel-'+n,title:'Новый раздел',currency:'EUR',sym:'€',fmt:'other',owner:1,on:false,support:{on:false,title:'Поддержать проект',text:'',button:'Поддержать',recipient:'',methods:[]},tiles:[mk('pervaya-plitka','Первая плитка','',100)]});A.sec='razdel-'+n;A.sel='sec:'+A.sec;dirty();toast('Раздел создан скрытым — включите «Показывать на сайте»');return all()}
 if(t.dataset.add!=null){A.addMenu=t.dataset.add||null;return drawTree()}
 if(t.dataset.addtype){if(t.classList.contains('dis'))return;const typ=t.dataset.addtype;if(typ==='Вино'&&A.addMenu!=='L1'){const tl=S().tiles.find(x=>x.slug===A.addMenu);tl.wines.push({name:'Новое вино',color:'красное',sweet:'сухое',grape:'',year:'',price:'',desc:''});A.sel=`w:${A.sec}/${tl.slug}/${tl.wines.length-1}`;toast('Вино добавлено: загрузите фото 4:5')}else if(typ==='Услуга'&&A.addMenu!=='L1'){const tl=S().tiles.find(x=>x.slug===A.addMenu);tl.services.push({title:'Новая услуга',text:'',price:'',note:'',button:'Заказать',url:'',recipient:'Монастырь «'+tl.title+'»',on:true});A.sel=`svc:${A.sec}/${tl.slug}/${tl.services.length-1}`;toast('Без ссылки на оплату услуга на сайте не показывается')}else toast('Добавлен элемент «'+typ+'»');A.addMenu=null;dirty();routeFor(A.sel);return all()}
 const r=t.closest('.row,[data-id]');if(r&&r.dataset.id){A.sel=r.dataset.id;routeFor(A.sel);all()}});
$('#form').addEventListener('input',e=>{const t=e.target;if(!t.dataset.path)return;let v=t.dataset.bool?t.checked:t.dataset.num?(t.value===''?'':+t.value):t.value;setVal(t.dataset.path,v);
 if(t.dataset.path.endsWith('.currency')){const s=S();s.sym={RUB:'₽',GEL:'₾',EUR:'€',USD:'$'}[v]}

$('#form').addEventListener('change',e=>{const t=e.target;

$('#form').addEventListener('click',e=>{const t=e.target.closest('[data-toast],[data-goto],[data-delpm],[data-adddom],[data-tcard]');if(!t)return;

document.addEventListener('dragstart',e=>{const d=e.target.closest('[data-dnd]');if(!d)return;drag=d;e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-dnd]');if(drag&&d&&d.dataset.dnd===drag.dataset.dnd){e.preventDefault();d.classList.add('drag-over')}});

 if(drag.dataset.dnd==='tiles'){const tl=S().tiles;const a=tl.findIndex(t=>'t:'+A.sec+'/'+t.slug===drag.dataset.id),b=tl.findIndex(t=>'t:'+A.sec+'/'+t.slug===d.dataset.id);tl.splice(b,0,tl.splice(a,1)[0])}
 if(drag.dataset.dnd==='pm'){const pay=resolve(d.closest('[data-base]').dataset.base);const a=+drag.dataset.i,b=+d.dataset.i;pay.methods.splice(b,0,pay.methods.splice(a,1)[0]);drawForm()}

$('#pvdom').onchange=e=>{pst.host=e.target.value;const d=DATA.domains.find(x=>x.host===pst.host);if(d.mode!=='all'){pst.section=d.mode;A.sec=d.mode}pst.page=null;all()};
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();$('#save').click()}});
addEventListener('resize',fit);fillDom();routeFor(A.sel);all();fit();
