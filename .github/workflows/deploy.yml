# Выкладка на reg.ru по FTP после каждого пуша в main.
# Нужны секреты репозитория: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR.
# Пока их нет, выкладка пропускается, а проверка PHP всё равно идёт.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite
      - name: Синтаксис PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Переводы на всех языках
        run: php bin/check-lang.php
      - name: Сайт отвечает, база создаётся сама
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php >/tmp/php.log 2>&1 &
          sleep 1
          latest=$(ls app/migrations/[0-9][0-9][0-9]_*.sql | tail -1 | xargs basename | cut -c1-3 | sed 's/^0*//')
          curl -fsS http://127.0.0.1:8080/health | tee /tmp/health.txt
          grep -q " schema=$latest\$" /tmp/health.txt
          curl -fsS http://127.0.0.1:8080/ | grep -q '<h1'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/net-takoy)" = 404
      - name: Тестовая лента со всеми блоками
        env:
          ENOTIS_DATA: /tmp/enotis-sample
        run: |
          mkdir -p "$ENOTIS_DATA"
          php bin/import.php tests/fixtures/sample/site.json
          php -S 127.0.0.1:8081 -t public public/index.php >/tmp/php-sample.log 2>&1 &
          sleep 1
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$1"; }
          test "$(code /)" = 200
          test "$(code /alaverdi)" = 200        # поп-ап плитки по прямому адресу
          test "$(code /alaverdi-red)" = 200    # поп-ап вина
          test "$(code /bez-teksta)" = 404      # плитке нечего показать
          test "$(code /en/)" = 200
          test "$(code /fr/)" = 404             # язык выключен
          test "$(code /doc/offer)" = 200
          test "$(code /en/doc/offer)" = 404    # нет перевода
          img=$(curl -fsS http://127.0.0.1:8081/ | grep -o '/uploads/photos/[^" ]*-m.jpg' | head -1)
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8081$img" | grep -q image/jpeg
          # Предупреждения нашего кода (строку про JIT пишет сам PHP раннера — её пропускаем).
          if grep -E 'PHP (Warning|Notice|Deprecated|Fatal)' /tmp/php-sample.log | grep -v 'JIT'; then exit 1; fi

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Есть ли FTP-секреты
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: echo "ready=$([ -n "$FTP_HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Выкладка по FTP
        if: steps.secrets.outputs.ready == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            data/site.sqlite*
            data/*.lock
            data/config.php
            data/reset-password.txt
            data/backups/**
            data/uploads/**
            public/uploads/**
      - name: Секретов нет
        if: steps.secrets.outputs.ready != 'yes'
        run: echo "::notice::FTP-секреты не заданы, выкладка пропущена."
